name: Deploy calculator Docker App to AWS EC2

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Deploy the calculator-app from Dev"
        default: "dev"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ecr-calculator
  CONTAINER_NAME: ecr-calculator-container
  INSTANCE_TYPE: t2.micro
  AMI_ID: ami-0bbdd8c17ed981ef9
  KEY_NAME: "sample-project-ec2 key"
  INSTANCE_NAME: prasath-ec2(27.10.2025)
  SECURITY_GROUP_NAME: launch-wizard-6
  SECURITY_GROUP_DESCRIPTION: "launch-wizard-5 created"
  VPC_ID: vpc-0203ae7df1d2077e1
  EIP_ALLOCATION_ID: eipalloc-03a2936b53e7423b8
  ECR_ROLE_NAME: calculator-ecr
  SERVER_NAME: prepyapi.adraproductstudio.com

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::934484537298:role/calculator-ecr

      - name: Install runner dependencies (jq)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      # 🛡 Security Group Setup
      - name: Check or Create Security Group
        id: sg
        run: |
          SG_ID=$(aws ec2 describe-security-groups \
            --filters Name=group-name,Values=${{ env.SECURITY_GROUP_NAME }} \
            --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || true)
          
          if [ -z "$SG_ID" ] || [ "$SG_ID" = "None" ]; then
            SG_ID=$(aws ec2 create-security-group \
              --group-name "${{ env.SECURITY_GROUP_NAME }}" \
              --description "${{ env.SECURITY_GROUP_DESCRIPTION }}" \
              --vpc-id ${{ env.VPC_ID }} \
              --query 'GroupId' --output text)
          fi

          echo "security_group_id=$SG_ID" >> $GITHUB_ENV

          aws ec2 authorize-security-group-ingress --group-id $SG_ID \
            --protocol tcp --port 22 --cidr 0.0.0.0/0 || true
          aws ec2 authorize-security-group-ingress --group-id $SG_ID \
            --protocol tcp --port 3000 --cidr 0.0.0.0/0 || true

      # ☁️ EC2 Instance Setup
      - name: Check if EC2 Instance Exists
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.INSTANCE_NAME }}" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text || echo "None")

          if [ "$INSTANCE_ID" = "None" ]; then
            echo "Creating new EC2 instance..."
            INSTANCE_ID=$(aws ec2 run-instances \
              --image-id ${{ env.AMI_ID }} \
              --count 1 \
              --instance-type ${{ env.INSTANCE_TYPE }} \
              --key-name "${{ env.KEY_NAME }}" \
              --security-group-ids ${{ env.security_group_id }} \
              --iam-instance-profile Name=${{ env.ECR_ROLE_NAME }} \
              --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=${{ env.INSTANCE_NAME }}}]" \
              --query 'Instances[0].InstanceId' --output text)
          fi

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_ENV
          aws ec2 wait instance-running --instance-ids $INSTANCE_ID

      - name: Get EC2 Public IP
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ env.instance_id }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_ENV
          echo "EC2 Instance Public IP: $PUBLIC_IP"

      - name: Associate Elastic IP
        run: |
          aws ec2 associate-address \
            --instance-id ${{ env.instance_id }} \
            --allocation-id ${{ env.EIP_ALLOCATION_ID }} || true

      # 🐳 Build Docker Image & Save
      - name: Build Docker image
        run: docker build -t myapp .

      - name: Save Docker image as tar
        run: docker save myapp > myapp.tar

      # 🔑 SSH Setup
      - name: Setup SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      # 📦 Copy app to EC2
      - name: Copy Docker image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.public_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "myapp.tar"
          target: "~/app/"

      # 🚀 Deploy app on EC2
      - name: SSH and deploy container
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ env.public_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            sudo apt-get update -y
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get install -y docker.io
              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            mkdir -p ~/app
            cd ~/app
            sudo docker load < myapp.tar
            sudo docker stop myapp || true
            sudo docker rm myapp || true
            sudo docker run -d -p 3000:3000 --name myapp myapp

      # 🧩 Optional: Deploy .env (if needed)
      - name: Send .env file to EC2
        if: env.public_ip != ''
        run: |
          echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
          scp -o StrictHostKeyChecking=no -i private_key.pem .env ubuntu@${{ env.public_ip }}:/home/ubuntu/app/.env
